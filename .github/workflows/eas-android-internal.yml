name: Build Android Internal APK (EAS)

on:
  workflow_dispatch:

# Set repo root as the default working directory for every step
defaults:
  run:
    working-directory: ${{ github.workspace }}
    shell: bash

jobs:
  build-android-internal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DEBUG: show where we are and what's here
      - name: Show workspace tree
        run: |
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          pwd
          ls -la
          echo "---- assets ----"
          ls -la assets || true
          echo "---- package.json ----"
          test -f package.json && cat package.json | head -n 20 || echo "package.json NOT FOUND"

      # Hard-fail if package.json is missing (so we don't get npm enoent later)
      - name: Verify package.json exists
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json not found at ${PWD}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Use npm install directly (we'll generate package-lock on first run)
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          test -f package-lock.json && echo "package-lock.json created."

      - name: Validate required assets
        run: |
          set -e
          for f in assets/icon.png assets/adaptive-icon.png assets/splash.png; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Missing or empty. Provide a real PNG."
              exit 1
            fi
            mime=$(file -b --mime-type "$f" || true)
            echo "$f -> $mime"
            echo "$mime" | grep -q "image/png" || { echo "::error file=$f::Not a PNG"; exit 1; }
          done

      - name: Expo Doctor
        run: npx --yes expo-doctor

      - name: EAS Build (Android internal APK)
        run: eas build -p android --profile internal --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download latest build artifact
        run: |
          mkdir -p dist
          eas build:download --platform android --latest --output dist/
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orryx-internal-apk
          path: dist/*.apk
